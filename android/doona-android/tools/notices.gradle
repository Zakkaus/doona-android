// Resolve the published archive and POM from the same release component.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import groovy.xml.XmlSlurper
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('releaseNoticeInputs') {
        doLast {
            def modules = app.configurations.releaseRuntimeClasspath.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts
            def poms = app.dependencies.createArtifactResolutionQuery()
                .forComponents(modules.collect { it.id.componentIdentifier })
                .withArtifacts(MavenModule, MavenPomArtifact).execute().resolvedComponents.collectEntries {
                    [(it.id): it.getArtifacts(MavenPomArtifact).first().file]
                }
            modules.each {
                def id = it.id.componentIdentifier
                def pom = poms[id]
                def licencePom = pom
                def model = new XmlSlurper().parse(licencePom)
                while (model.licenses.license.isEmpty()) {
                    def parent = model.parent
                    if (parent.isEmpty()) throw new GradleException("No POM licences for ${id}")
                    def gav = "${parent.groupId}:${parent.artifactId}:${parent.version}"
                    def dep = app.dependencies.create("${gav}@pom")
                    licencePom = app.configurations.detachedConfiguration(dep).singleFile
                    model = new XmlSlurper().parse(licencePom)
                }
                println "NOTICE\t${id.moduleIdentifier}\t${id.version}\t${it.file}\t${pom}\t${licencePom}"
            }
        }
    }
}
