[versions]
agp = "9.5.2"
kotlin = "2.4.21"
# https://developer.android.com/develop/ui/compose/bom/bom-mapping: material3 1.5.0, ui and foundation 1.13.0
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
# https://developer.android.com/jetpack/androidx/releases/navigation3: 1.2.2 stable (2026-11-18); 1.3 is alpha.
navigation3 = "1.2.2"
lifecycle = "2.11.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
datastore = "1.3.0"
# https://github.com/robolectric/robolectric/releases/tag/robolectric-4.18.1
robolectric = "4.18.1"
# https://github.com/takahirom/roborazzi/releases/tag/1.79.0
roborazzi = "1.79.0"
junit = "4.13.2"
# Material Components for Android: only its color.utilities (material-color-utilities) in tests, to build the scheme
# Android derives from a wallpaper colour. https://github.com/material-components/material-components-android/releases/tag/1.14.0
material-components = "1.14.0"
# Code style as in Now in Android: Spotless with ktlint, configured by .editorconfig.
spotless = "8.12.0"
ktlint = "1.8.0"
androidx-test-ext-junit = "1.3.0"
# compose ui-test 1.12.1 brings Espresso 3.5.1, which calls InputManager.getInstance(); SDK 37 removed it.
androidx-test-espresso = "3.7.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-accessibility = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
junit = { module = "junit:junit", version.ref = "junit" }
material-components = { module = "com.google.android.material:material", version.ref = "material-components" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
