name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request that changes only documents no build reads builds nothing; any other change builds.
      - id: paths
        run: |
          build=true
          docs=(':(exclude)README.md' ':(exclude)README.zh-TW.md' ':(exclude)CONTRIBUTING.md' ':(exclude)PRIVACY.md'
            ':(exclude).github/*.md' ':(exclude)doc/**/*.md')
          if [[ $GITHUB_EVENT_NAME == pull_request ]] && git diff --quiet HEAD^1 HEAD -- . "${docs[@]}"; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # A release tag must carry the newest Geo data. The weekly geo-bundle workflow moves the pins.
  geo-current:
    name: Geo pins are the newest release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Fail when a newer MetaCubeX release exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run crates/doona-core/tools/update_geo.py --current

  android:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    name: honk-android + tunbench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hev-socks5-tunnel is a submodule with submodules of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # check_limits.py compares the ratchet with HEAD^1, the target branch of a pull request's
          # merge commit; a push fetches its own base commit.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check the harness scripts
        working-directory: android/scripts
        env:
          UV_LOCKED: "1"
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pytest
          shellcheck run.sh
      - name: Check file, function and package limits
        working-directory: android/scripts
        env:
          UV_LOCKED: "1"
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push may carry several commits: compare with the branch head before it.
            if [ -z "${BEFORE//0/}" ]; then
              echo "new branch: no base ratchet to compare with"
              base=
            else
              git fetch --depth=1 origin "$BEFORE"
              base=$BEFORE
            fi
          fi
          uv run python check_limits.py ${base:+--base-rev "$base"}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-android/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/honk-android
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install the NDK, the API 37.1 platform and cargo-ndk
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk@4.1.2
      - name: fmt, clippy and tests
        working-directory: crates/honk-android
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features bench -- -D warnings
          cargo test --locked --features bench
          cargo test --locked --release --test relay
          cargo ndk -t arm64-v8a --platform 29 clippy --locked --all-targets --features bench -- -D warnings
      - name: Check Kotlin format, build the APK, lint and run the JVM tests
        working-directory: android/tunbench
        run: ./gradlew spotlessCheck assembleDebug lint testDebugUnitTest
      - name: Check the 16 KiB page alignment and the JNI exports of the native libraries
        run: |
          set -euo pipefail
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          apk=android/tunbench/app/build/outputs/apk/debug/app-debug.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign" -c -P 16 4 "$apk"
          unzip -oq "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/apk"
          for so in libhonkengine.so libhev-socks5-tunnel.so; do
            echo "$so"
            "$readelf" -lW "$RUNNER_TEMP/apk/lib/arm64-v8a/$so" | awk '$1 == "LOAD" { print; if ($NF != "0x4000") bad = 1 } END { exit bad }'
          done
          # libhonkengine.so exports Java_dev_tunbench_<class>_<name> for exactly the external funs
          # of the classes it binds by name, the declarations JniNamesTest pins.
          kt=android/tunbench/app/src/main/kotlin/dev/tunbench
          diff <(for c in HonkEngine Bench; do grep -oP '\bexternal fun \K\w+' "$kt/$c.kt" | sed "s/^/Java_dev_tunbench_${c}_/"; done | sort) \
            <("$readelf" --dyn-syms -W "$RUNNER_TEMP/apk/lib/arm64-v8a/libhonkengine.so" | awk '$7 != "UND" && $8 ~ /^Java_dev_tunbench_/ { print $8 }' | sort)

  doona-core:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    name: doona-android core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/doona-core/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/doona-core
          key: doona-core-host
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: doona-core fmt, clippy and tests
        working-directory: crates/doona-core
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  doona-kotlin:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    name: doona-android Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A manual run holds the allowlist to HEAD^1, which this depth brings along.
          fetch-depth: 2
      - name: Find the revision the components allowlist is held to
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # GITHUB_ENV is job-scoped, so the base is found here, not in the `android` job. The checkout is two commits
          # deep: a base outside it is fetched on its own, which is all `git show <base>:<path>` needs.
          base=
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE ;;
            # A push may carry several commits: compare with the branch head before it, as check_limits does above.
            push) [ -z "${BEFORE//0/}" ] || base=$BEFORE ;;
            # workflow_dispatch and any other event: the commit before the one checked out.
            *) base=$(git rev-parse --verify -q HEAD^1) || base= ;;
          esac
          if [ -n "$base" ]; then
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"
          else
            echo "no base to hold the allowlist to"
          fi
          echo "RATCHET_BASE=$base" >> "$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the API 37.1 platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"'
      - name: Check the layers and the design tokens
        working-directory: android/doona-android
        run: |
          set -euo pipefail
          tools/check-tokens.sh
          tools/check-components.sh ${RATCHET_BASE:+--base-rev "$RATCHET_BASE"}
          tools/test-check-components.sh
          tools/check-layers.sh
          tools/check-samples.sh
      - name: Check Kotlin format, lint, run the JVM tests and the screenshots
        working-directory: android/doona-android
        # The release job builds the native library and bundles Geo data; JVM checks need neither.
        run: ./gradlew -Pdoona.skipCore=true spotlessCheck :app:lintDebug :icons:lintDebug :flags:lintDebug :app:testDebugUnitTest :flags:testDebugUnitTest :app:verifyRoborazziDebug

  doona-release:
    name: doona-android release APK
    # Stale Geo pins on a tag stop the release build. geo-current is skipped on every other ref,
    # and `needs` alone would then skip this job too.
    needs: [inputs, geo-current]
    if: ${{ !cancelled() && needs.inputs.outputs.build == 'true' && (needs.geo-current.result == 'success' || needs.geo-current.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/doona-core/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          targets: aarch64-linux-android
          components: rust-docs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/doona-core
          key: doona-core-android
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Cache pinned Geo assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/doona-geo
          key: doona-geo-${{ hashFiles('crates/doona-core/tools/geo-pins.json') }}
      - name: Install the NDK, the API 37.1 platform and cargo-ndk
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk@4.1.2
      - name: Build the release APK and check its size and 16 KiB page alignment
        working-directory: android/doona-android
        env:
          CORE_PROFILE: ${{ github.event_name == 'pull_request' && 'ci-release' || 'release' }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -Pdoona.coreProfile="$CORE_PROFILE"
          apk=app/build/outputs/apk/release/app-release.apk
          python3 -m unittest discover -s tools -p 'test_notices.py'
          python3 tools/notices.py --apk "$apk"
          # One fixed ceiling for both profiles. Owner ruling (2026-11-26): 「你限制到40MB我能接受但是不要屎山拉屎就行」
          # (a 40 MB limit is fine, as long as no waste piles into it). The size table in the run summary shows growth.
          max_apk_bytes=40000000
          { echo "### Release APK ($CORE_PROFILE)"; python3 tools/apk_sizes.py "$apk"; } | tee -a "$GITHUB_STEP_SUMMARY"
          apk_bytes=$(stat -c %s "$apk")
          echo "Release APK: $apk_bytes bytes (limit: $max_apk_bytes)"
          if (( apk_bytes > max_apk_bytes )); then
            echo "::error::Release APK exceeds its size budget"
            exit 1
          fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign" -c -P 16 4 "$apk"
