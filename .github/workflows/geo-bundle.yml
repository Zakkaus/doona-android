name: Update geo bundle pins

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-bundle-main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      base_inputs: ${{ steps.candidate.outputs.base_inputs }}
      pins: ${{ steps.candidate.outputs.pins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Test the update and notices tools and check the honk pin
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          uv run --no-project --python '>=3.11' python -m unittest discover -s crates/doona-core/tools -p test_update_geo.py
          uv run --no-project --python '>=3.11' python -m unittest discover -s android/doona-android/tools -p test_notices.py
          uv run --no-project --python '>=3.11' python - <<'PY'
          import tomllib
          from pathlib import Path

          def dependencies(manifest):
              return tomllib.loads(Path(manifest).read_text(encoding="utf-8"))["dependencies"]

          core = dependencies("crates/doona-core/Cargo.toml")["honk-config"]
          verifier = dependencies("crates/doona-core/tools/geo-check/Cargo.toml")
          for name in ("honk-config", "honk-core"):
              if any(verifier[name][key] != core[key] for key in ("git", "rev")):
                  raise SystemExit(f"geo-check {name} pin differs from doona-core")
          PY
      - name: Fetch and verify the newest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run crates/doona-core/tools/update_geo.py --latest "$RUNNER_TEMP/geo-bundle"
      - name: Check required geo labels and reject missing labels
        working-directory: crates/doona-core/tools/geo-check
        env:
          DAE_LOCATION_ASSET: ${{ runner.temp }}/geo-bundle
        run: |
          cargo run --locked -- tests/fixtures/required-labels.dae
          if output=$(cargo run --locked -- tests/fixtures/missing-labels.dae 2>&1); then
            echo 'Geo verifier accepted missing labels' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F 'doona-missing' <<< "$output"
          grep -F 'cn@nope' <<< "$output"
          grep -F 'geo bundle failed coverage' <<< "$output"
      - name: Export verified pins only when changed
        id: candidate
        run: |
          manifest="$RUNNER_TEMP/geo-bundle/geo-manifest.json"
          if ! cmp -s "$manifest" crates/doona-core/tools/geo-pins.json; then
            inputs=$(git ls-tree HEAD -- crates/doona-core/{tools,Cargo.toml,rust-toolchain.toml,.cargo})
            printf 'base_inputs=%s\n' "$(git hash-object --stdin <<< "$inputs")" >> "$GITHUB_OUTPUT"
            pins=$(jq -c . "$manifest")
            printf 'pins=%s\n' "$pins" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: verify
    if: needs.verify.outputs.pins != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Commit the verified pins to main
        env:
          BASE_INPUTS: ${{ needs.verify.outputs.base_inputs }}
          PINS: ${{ needs.verify.outputs.pins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # These inputs include geo-pins.json, so this also stops when main's pins have changed.
          inputs=$(git ls-tree HEAD -- crates/doona-core/{tools,Cargo.toml,rust-toolchain.toml,.cargo})
          if [ "$(git hash-object --stdin <<< "$inputs")" != "$BASE_INPUTS" ]; then
            echo 'Geo verifier inputs changed during verification. Dispatch the workflow again.' >&2
            exit 1
          fi
          pins_file=crates/doona-core/tools/geo-pins.json
          index=android/doona-android/app/src/main/assets/licenses/index.json
          files=("$pins_file" THIRD_PARTY_NOTICES.md "$index")
          jq . <<< "$PINS" > "$pins_file"
          # The licence data follows the pins; the release job compares it with a full rebuild.
          python3 android/doona-android/tools/notices.py --geo-pins
          others=$(git status --porcelain -- . "${files[@]/#/:(exclude)}")
          if [ -n "$others" ]; then
            printf 'The notices changed files that this commit leaves out:\n%s\n' "$others" >&2
            exit 1
          fi
          # GitHub signs a commit made by this mutation. It fails if main has moved past
          # expectedHeadOid. The file contents go through pipes: they exceed the argument limit.
          for file in "${files[@]}"; do
            jq -n --arg path "$file" --rawfile contents <(base64 -w0 "$file") '{$path, $contents}'
          done | jq -s \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "build(geo): update MetaCubeX pins to $(jq -r .release_date "$pins_file")" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: .}}}}' |
            gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'
          # A commit made with GITHUB_TOKEN starts no push workflow; a dispatch does start one.
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main
