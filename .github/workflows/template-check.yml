name: template-check
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]
permissions: {}
concurrency:
  group: template-check-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The event SHA is the trusted base for pull_request_target, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check template and close or reopen
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
        run: bash .github/scripts/template-check.sh "$NUMBER"
