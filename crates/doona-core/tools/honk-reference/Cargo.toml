[package]
name = "doona-honk-reference"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Its own workspace: this tool links stock honk on the Linux host and must not join doona-core's.
[workspace]

[dependencies]
anyhow = "1"
# honk main with the embedded engine and its DNS (items 03, 04 and 09, on the fork until they land
# upstream), linked without its default features, so without clash-api and axum; `embedded` adds
# `Engine::resolve_dns`. build.rs reads the honk-core rev for the report.
honk-config = { git = "https://github.com/Zakkaus/honk", rev = "89663a216b8232d4e419ec91ac5d6b74adf6445e" }
honk-core = { git = "https://github.com/Zakkaus/honk", rev = "89663a216b8232d4e419ec91ac5d6b74adf6445e", default-features = false, features = ["embedded"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "rt", "time"] }
tracing = "0.1"
uuid = "1"
tracing-subscriber = "0.3"

[patch.crates-io]
boring-sys = { git = "https://github.com/Glassyiris/boring-sys", rev = "3beb573b65ecaa69b7eefe3c2fecd074b97facd2" }
quinn = { git = "https://github.com/Glassyiris/quinn", rev = "d98acc02b8c26417a84180a366e1eb5b22af2b24" }
quinn-proto = { git = "https://github.com/Glassyiris/quinn", rev = "d98acc02b8c26417a84180a366e1eb5b22af2b24" }
